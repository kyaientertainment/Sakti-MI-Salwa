<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SAKTI - MI Salafiyah Wareng</title>

    <meta name="theme-color" content="#1e1b4b">
    <meta name="description" content="Sistem Aplikasi Karakter dan Tata Tertib Islami">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .hidden { display: none !important; }
        .tab-active {
            border-bottom: 3px solid #4f46e5; /* Indigo 600 */
            color: #4f46e5;
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-gray-800 min-h-screen flex flex-col">

    <!-- HALAMAN LOGIN -->
    <div id="login-page" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-indigo-600">
            <div class="text-center mb-8">
                <div class="bg-indigo-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-scale-balanced text-2xl text-indigo-600"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-indigo-900 tracking-tight">SAKTI</h1>
                <h2 class="text-xs font-bold text-gray-500 mt-1 uppercase tracking-wider">Sistem Aplikasi Karakter & Tata Tertib Islami</h2>
                <h3 class="text-xs text-gray-400 mt-1">MI Salafiyah Wareng</h3>
            </div>
            
            <button id="btn-google-login" type="button" class="w-full flex items-center justify-center bg-white border-2 border-gray-200 text-gray-700 font-bold py-3 px-4 rounded-xl hover:bg-slate-50 transition shadow-sm">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5 mr-3">
                Masuk dengan Akun Google
            </button>
            <p class="text-[10px] text-center text-gray-400 mt-4">Hanya untuk Guru dan Staff MI Salafiyah Wareng</p>
        </div>
    </div>

    <!-- NAVBAR UTAMA (Tampil setelah login) -->
    <nav id="navbar" class="hidden bg-indigo-950 text-white p-3 sm:p-4 shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-scale-balanced text-xl text-indigo-400"></i>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold leading-tight">SAKTI</h1>
                    <p class="text-[10px] text-indigo-300 leading-tight">MI Salafiyah Wareng</p>
                </div>
            </div>
            <div class="flex items-center gap-3 text-right">
                <div class="hidden sm:block">
                    <p id="user-display-name" class="font-bold text-sm leading-tight">-</p>
                    <p id="user-display-role" class="text-indigo-300 text-xs leading-tight">Guru / Admin</p>
                </div>
                <button id="btn-logout" class="bg-red-500 hover:bg-red-600 px-3 py-2 rounded-lg text-xs font-semibold transition shadow-sm">
                    <i class="fa-solid fa-right-from-bracket sm:mr-1"></i> <span class="hidden sm:inline">Keluar</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- KONTEN UTAMA APLIKASI -->
    <div id="main-app" class="hidden max-w-6xl mx-auto w-full mt-6 px-4 pb-12 flex-1">
        
        <!-- MENU TAB -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-2 mb-6 overflow-x-auto">
            <div class="flex min-w-max gap-2 text-sm font-semibold text-gray-500">
                <button onclick="switchTab('input')" id="tab-btn-input" class="px-4 py-2.5 rounded-lg tab-active transition bg-indigo-50">
                    <i class="fa-solid fa-pen-to-square mr-1.5"></i> Input Kejadian
                </button>
                <button onclick="switchTab('siswa')" id="tab-btn-siswa" class="px-4 py-2.5 rounded-lg hover:text-indigo-600 hover:bg-indigo-50 transition">
                    <i class="fa-solid fa-users mr-1.5"></i> Data Poin Siswa
                </button>
                <button onclick="switchTab('kategori')" id="tab-btn-kategori" class="px-4 py-2.5 rounded-lg hover:text-indigo-600 hover:bg-indigo-50 transition">
                    <i class="fa-solid fa-book-bookmark mr-1.5"></i> Kamus Kategori
                </button>
                <button onclick="switchTab('laporan')" id="tab-btn-laporan" class="px-4 py-2.5 rounded-lg hover:text-indigo-600 hover:bg-indigo-50 transition">
                    <i class="fa-solid fa-chart-pie mr-1.5"></i> Rekap & Laporan
                </button>
            </div>
        </div>

        <!-- AREA HALAMAN -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 min-h-[400px] flex items-center justify-center text-center">
            <div id="content-area" class="text-gray-400">
                <i class="fa-solid fa-hammer text-4xl mb-3 text-indigo-200"></i>
                <h3 class="text-lg font-bold text-gray-600">Selamat Datang di SAKTI!</h3>
                <p class="text-sm mt-1">Struktur antarmuka berhasil dimuat. Konten halaman sedang dibangun...</p>
            </div>
        </div>

    </div>

    <!-- SCRIPT FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } 
            from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore } 
            from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ==========================================
        // MASUKKAN FIREBASE CONFIG ANDA DI BAWAH INI
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAxghjlxoSksirj_IZk4fNomFXOzjHPnhQ",
            authDomain: "sakti-mi-salwa.firebaseapp.com",
            projectId: "sakti-mi-salwa",
            storageBucket: "sakti-mi-salwa.firebasestorage.app",
            messagingSenderId: "456238518538",
            appId: "1:456238518538:web:6477945809df9e59d66af3"
        };
        // ==========================================

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        const showLoading = (msg) => Swal.fire({title: msg, allowOutsideClick: false, didOpen: () => Swal.showLoading()});

        // Autentikasi State Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('navbar').classList.remove('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('user-display-name').innerText = user.email.split('@')[0];
            } else {
                document.getElementById('login-page').classList.remove('hidden');
                document.getElementById('navbar').classList.add('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        });

        // Logika Login Google
        document.getElementById('btn-google-login').addEventListener('click', async () => {
            showLoading('Membuka Google Login...');
            try {
                await signInWithPopup(auth, googleProvider);
                Swal.close();
            } catch (error) {
                Swal.fire('Gagal Login', error.message, 'error');
            }
        });

        // Logika Logout
        document.getElementById('btn-logout').addEventListener('click', () => {
            Swal.fire({
                title: 'Keluar dari SAKTI?',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#4f46e5',
                confirmButtonText: 'Ya, Keluar',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) signOut(auth);
            });
        });

        // Logika Pindah Tab Sementara
        window.switchTab = (tabName) => {
            const tabs = ['input', 'siswa', 'kategori', 'laporan'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                btn.classList.remove('tab-active', 'bg-indigo-50');
                btn.classList.add('hover:text-indigo-600', 'hover:bg-indigo-50');
            });
            
            const activeBtn = document.getElementById(`tab-btn-${tabName}`);
            activeBtn.classList.remove('hover:text-indigo-600');
            activeBtn.classList.add('tab-active', 'bg-indigo-50');
        };
    </script>
</body>
</html>
